[project]
name = "sahaay-backend"
version = "0.1.0"
description = "Sahaay backend: FastAPI + deterministic rules"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.24",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=2.1",
    "pytesseract>=0.3.13",
    "sse-starlette>=3.7.1",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"app/graph/templates.py" = ["E501"]
