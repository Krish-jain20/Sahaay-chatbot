[project]
name = "sahaay-backend"
version = "0.1.0"
description = "Sahaay backend: FastAPI + deterministic rules"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "google-genai>=3.6.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "sse-starlette>=3.7.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"app/graph/templates.py" = ["E501"]
